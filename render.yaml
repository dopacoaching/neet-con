# Render Blueprint — CareerX API (Express + MongoDB)
# Deploy: Render Dashboard > New > Blueprint > pick this repo.
# Secrets (sync:false) are NOT stored here — set them in the Render dashboard.
services:
  - type: web
    name: neetcon-2026-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is provided by Render automatically; server.js reads process.env.PORT.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_CREDENTIALS
        sync: false # "email:password" bootstrap admin login(s)
      - key: CLIENT_URL
        sync: false # e.g. https://careerx.dopacoaching.com  (no trailing slash)
      # Closed 2026-08-13 — event has taken place.
      - key: REGISTRATIONS_OPEN
        value: "false"
      # --- WhatsApp (Meta Cloud API) — primary confirmation channel ---
      - key: WHATSAPP_MOCK
        value: "false" # LIVE — real confirmation messages are sent
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false # any random string; paste the same value in Meta's webhook config
      - key: WHATSAPP_APP_SECRET
        sync: false # Meta app secret — enables webhook HMAC verification (optional)
      - key: WHATSAPP_TEMPLATE_NAME
        value: careerx_confirmation_v7
      - key: WHATSAPP_GUESTCOUNT_TEMPLATE_NAME
        value: careerx_guest_count_update
      - key: WHATSAPP_REMINDER_TEMPLATE_NAME
        value: careerx_event_reminder_v3
      - key: WHATSAPP_TEMPLATE_LANG
        value: en
      - key: WHATSAPP_COUNTRY_CODE
        value: "91"
      - key: WHATSAPP_API_VERSION
        value: v21.0
      # --- Event details (shown in confirmation message / email) ---
      # Online event — EVENT_MAP_URL is the join/meeting link; set once confirmed.
      - key: EVENT_DATE
        value: Thursday, 13 August 2026
      - key: EVENT_TIME
        value: 7:30 PM
      - key: EVENT_VENUE
        value: Online
      - key: WHATSAPP_RESCHEDULE_TEMPLATE_NAME
        value: careerx_reschedule_evening_v1
      - key: WHATSAPP_MEETING_STARTING_TEMPLATE_NAME
        value: careerx_meeting_starting_v1
      - key: MEETING_STARTING_ZOOM_LINK
        value: "https://us06web.zoom.us/j/84104668901?pwd=MTNBItV4sbuiOUzQ1u7WWueG1DwNfG.1"
      # Shared secret for POST /api/whatsapp/trigger-meeting-starting — lets
      # the GitHub Actions cron job (.github/workflows/trigger-meeting-starting.yml)
      # fire the 7:15 PM IST broadcast without an admin login session. Must
      # match the CRON_TRIGGER_SECRET GitHub Actions repo secret.
      - key: CRON_TRIGGER_SECRET
        sync: false
      # Admin's own WhatsApp number — receives the automatic "broadcast
      # finished" status report (careerx_broadcast_report_v1 template).
      - key: BROADCAST_REPORT_NUMBER
        value: "7306540341"
      - key: WHATSAPP_BROADCAST_REPORT_TEMPLATE_NAME
        value: careerx_broadcast_report_v1
      - key: EVENT_MAP_URL
        value: ""
      # --- Email (SMTP) — backup confirmation + organizer notification ---
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false # Gmail address
      - key: SMTP_PASS
        sync: false # Gmail App Password (16 chars, no spaces)
      - key: MAIL_FROM
        sync: false # e.g. "CareerX <your.gmail@gmail.com>"
      - key: ORGANIZER_EMAIL
        sync: false # where new-registration notifications are sent
